name: Release

# Push a tag like v0.6.0 to build the update site, create a GitHub Release with it
# and publish it to the p2 update site (alfsch/alfsch.github.io, eclipse-updates/workspacemechanic).
#
# The update site is a composite repository with one folder per release, so publishing a
# release adds a folder and never touches the older ones (see .github/scripts/update-site.py).
# Run the workflow by hand with the tag of an existing release to publish only that release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an existing GitHub Release to publish to the update site, e.g. v0.6.1'
        required: true

jobs:
  build:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yaml

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check that the tag matches the project version
        run: |
          version=$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' parent/pom.xml | head -n 1)
          if [ "v${version%-SNAPSHOT}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the project version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: update-site
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/update-*.zip "workspacemechanic-update-site-$GITHUB_REF_NAME.zip"
          gh release create "$GITHUB_REF_NAME" "workspacemechanic-update-site-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Requires Java 17. Install from https://alfsch.github.io/eclipse-updates/workspacemechanic or with the attached update site zip (Help > Install New Software > Add > Archive)."

  publish:
    needs: release
    # runs after a successful release; when started by hand the release job is skipped on purpose
    if: ${{ !cancelled() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    # Add required reviewers to this environment (Settings > Environments) to approve each publish.
    environment: update-site
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Download the update site of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern '*.zip' --dir dist
          unzip -q dist/*.zip -d repository
      - uses: actions/checkout@v6
        with:
          repository: alfsch/alfsch.github.io
          ssh-key: ${{ secrets.UPDATE_SITE_DEPLOY_KEY }}
          path: site
      - name: Add the release to the update site
        run: python3 .github/scripts/update-site.py add site/eclipse-updates/workspacemechanic "${TAG#v}" repository
      - name: Publish
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A eclipse-updates/workspacemechanic
          git commit -m "Publish workspacemechanic $TAG"
          git push origin HEAD
