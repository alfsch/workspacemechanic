name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up Maven 3.9.9 (Tycho 4 needs Maven 3.9 or newer)
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16
      - name: Install SWT test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0
      - name: Build
        env:
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          sleep 3
          mvn -B -f parent/pom.xml clean install
      - name: Upload update site
        uses: actions/upload-artifact@v4
        with:
          name: update-site
          path: parent/releng/update/target/update-*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            parent/bundles/*/target/pmd.xml
            parent/bundles/*/target/checkstyle-result.xml
            parent/bundles/*/target/spotbugsXml.xml
            parent/examples/*/target/pmd.xml
            parent/examples/*/target/checkstyle-result.xml
            parent/examples/*/target/spotbugsXml.xml
          if-no-files-found: warn
          retention-days: 14
