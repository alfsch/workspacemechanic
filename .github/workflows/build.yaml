name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up Maven 3.9.9 (Tycho 4 needs Maven 3.9 or newer)
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9
      - name: Install SWT test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0
      - name: Build
        env:
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          sleep 3
          mvn -B -f parent/pom.xml clean install
